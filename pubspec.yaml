name: frecu
description: "Intercomunicador de voz grupal sin internet"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  app_settings: ^7.0.0
  audio_session: ^0.2.4
  auto_route: ^11.2.0
  bluetooth_low_energy: ^6.2.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_webrtc: ^1.6.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  json_annotation: ^4.12.0
  logger: ^2.5.0
  mobile_scanner: ^7.5.0
  nfc_manager: 4.2.1
  nfc_manager_ndef: ^1.1.0
  nsd: ^5.0.1
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shelf: ^1.4.3
  shelf_web_socket: ^3.0.0
  slang: ^4.4.1
  slang_flutter: ^4.4.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true

  # Licencias OFL de las fuentes empaquetadas.
  assets:
    - assets/fonts/archivo/OFL.txt
    - assets/fonts/martianmono/OFL.txt
    - assets/fonts/doto/OFL.txt

  # Fuentes variables de Portadora (google/fonts, OFL). Los nombres coinciden
  # con `FrFonts`; los ejes los mueve `FrType` con `fontVariations`.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo.ttf
    - family: Martian Mono
      fonts:
        - asset: assets/fonts/martianmono/MartianMono.ttf
    - family: Doto
      fonts:
        - asset: assets/fonts/doto/Doto.ttf
